[package]
name = "broglow"
version = "1.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Suren Khorenyan"]
description = "TUI dashboard and menu bar / system tray indicator for monitoring Claude Code, opencode, Codex, and Copilot sessions"
license = "MIT"
repository = "https://github.com/broglow/broglow"
keywords = ["claude", "agents", "cli", "sessions", "tui"]
categories = ["command-line-utilities"]

[[bin]]
name = "broglow"
path = "src/main.rs"

[[test]]
name = "menubar_usage_native"
path = "tests/menubar_usage_native.rs"
harness = false

[dev-dependencies]
# Integration tests (tests/) drive the compiled binary end-to-end.
assert_cmd = "2"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSAppearance", "NSBitmapImageRep", "NSButton", "NSColorSpace", "NSImageRep",
    "NSView",
] }

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
notify = "8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tray-icon = "0.25"
tao = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serialport = "4"
espflash = { version = "4.6", default-features = false, features = ["serialport"] }

# Custom tray popover (design 1a/1c): frameless tao window + system webview
# (WKWebView on macOS, WebView2 on Windows). Linux keeps the native tray menu
# because libappindicator emits no tray click events to anchor a popover to.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# Transparency is configured at runtime with WebViewBuilder::with_transparent.
wry = "0.57"

# Process-liveness check for reaping sessions whose Claude Code process exited
# without a SessionEnd hook (terminal.rs `is_alive`): kill(pid, 0) via libc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Desktop notifications on non-macOS platforms (WinRT toast / freedesktop).
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

# Console-window hiding + autostart registry access for Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # CreateMutexW lives in Threading but takes SECURITY_ATTRIBUTES, so it's
    # additionally gated on Win32_Security.
    "Win32_Security",
    "Win32_System_Console",
    # Ancestor-process walk for click-to-focus (terminal.rs).
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"

# BLE is opt-in on the Mac app; other platforms keep USB support.
[target.'cfg(target_os = "macos")'.dependencies]
# WebKit private API to lift the popover's 60 fps cap (popover.rs). Same
# version wry already pulls in.
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSAttributedString", "NSButton", "NSColor", "NSControl",
    "NSFont", "NSGraphics", "NSGraphicsContext", "NSImage", "NSStatusBarButton",
    "NSStatusItem", "NSTextAttachment",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSAttributedString", "NSData", "NSGeometry", "NSRange", "NSString",
] }
btleplug = "=0.13.1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
uuid = "1"

[profile.release]
# Whole-program optimization and no symbol table: the shipped binary shrinks
# from ~8.8 MB to ~5.4 MB (measured 2026-10-27, aarch64). Release builds take
# about twice as long; dev builds are unaffected.
lto = "fat"
codegen-units = 1
strip = true
