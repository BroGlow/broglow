site_name: BroGlow DIY
site_author: Suren Khorenyan
copyright: Copyright &copy; 2026 Suren Khorenyan
docs_dir: guide
# Only this generated subtree is cleaned; the landing stays in site/index.html.
site_dir: docs
hooks:
  - pages.py
watch:
  - ../docs
  - ../models/broglow/PRINT_GUIDE.md
  - ../models/broglow/PRINT_GUIDE.en.md
theme:
  name: material
  custom_dir: overrides
  font: false
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  palette:
    scheme: slate
    primary: custom
    accent: deep orange
  features:
    - content.code.copy
    - navigation.footer
    - toc.integrate
plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          fixed_link: .
        - locale: ru
          name: Русский
          fixed_link: ru/
          nav_translations:
            Build: Сборка
            Install and connect: Установка и подключение
            Codex: Codex
            Troubleshooting: Диагностика
            Reference: Справочники
            Maintainers: Для разработчиков
            Hardware reference: Техническое руководство
            Printing and assembly: Печать и сборка
            Firmware reference: Справочник прошивки
            Release and publication: Выпуск и публикация
            Images and photos: Изображения и фотографии
            Enclosure design: Конструкция корпуса
nav:
  - Build: index.md
  - Install and connect: installation.md
  - Codex: codex.md
  - Troubleshooting: troubleshooting.md
  - Reference:
      - Hardware reference: hardware.md
      - Printing and assembly: printing.md
      - Firmware reference: firmware.md
      - Enclosure design: enclosure.md
  - Maintainers:
      - Release and publication: releasing.md
      - Images and photos: media.md
markdown_extensions:
  - attr_list
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - md_in_html
extra_css:
  - assets/guide.css
extra_javascript:
  - assets/language.js
  - assets/copy.js
# Downloads and the landing are intentionally outside the docs source tree.
# check-links.py verifies these paths in the built site.
validation:
  links:
    not_found: ignore
