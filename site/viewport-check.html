<!doctype html>
<html lang="en"><meta charset="utf-8"><title>BroGlow responsive review</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:20px;font:14px system-ui;background:#e4e8e1;color:#18251e}button{padding:10px;margin:0 8px 15px 0;cursor:pointer}iframe{display:block;border:1px solid #a8b49f;background:#f5f7f2}pre{font:12px/1.6 monospace}h1{font-size:20px}</style>
<h1>BroGlow viewport review</h1><button data-size="723,892">Review 723 × 892</button><button data-size="390,844">Mobile 390 × 844</button><button data-size="360,640">Small 360 × 640</button><button data-size="667,375">Landscape 667 × 375</button><button data-size="1440,900">Desktop 1440 × 900</button><pre id="result" role="status">Loading review viewport…</pre><iframe id="preview" title="BroGlow viewport preview" src="./" width="723" height="892"></iframe>
<script>
const frame=document.querySelector('iframe');
frame.src='./'+window.location.search+window.location.hash;
let check=()=>{};
document.querySelectorAll('button').forEach(button=>button.onclick=()=>{const [width,height]=button.dataset.size.split(',');frame.width=width;frame.height=height;requestAnimationFrame(check);});
frame.onload=()=>{const doc=frame.contentDocument;check=()=>{const win=frame.contentWindow;const photo=doc.querySelector('.desk-photo img').getBoundingClientRect();const type=selector=>win.getComputedStyle(doc.querySelector(selector)).fontSize;document.querySelector('#result').textContent=`Viewport ${win.innerWidth} × ${win.innerHeight}\nHorizontal overflow: ${doc.documentElement.scrollWidth>win.innerWidth?'FAIL':'none'}\nType: body ${type('.hero-copy>p')} · controls ${type('.hero-states button')} · captions ${type('.desk-photo figcaption')}\nApp scale: ${win.getComputedStyle(doc.querySelector('.session-panel')).transform}\nPage flow: ${win.getComputedStyle(doc.querySelector('#story')).position} (no pinned sections)\nFull-on photo ratio: ${(photo.width/photo.height).toFixed(3)} (expected 1.400)\nActual app: ${doc.querySelector('#app-preview').dataset.ready==='true'?'loaded':'loading'}\nLamp model: ${doc.body.dataset.modelReady==='true'?'loaded':doc.body.dataset.modelError==='true'?'photo fallback':'loading'}`;};new ResizeObserver(check).observe(frame);new ResizeObserver(check).observe(doc.body);win=frame.contentWindow;win.addEventListener('broglow:model-ready',check);win.addEventListener('broglow:model-error',check);win.addEventListener('broglow:app-resize',check);check();};
</script></html>
