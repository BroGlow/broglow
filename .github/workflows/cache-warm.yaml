name: Warm release dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dependency-cache-warm
  cancel-in-progress: false

jobs:
  native:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: release-${{ matrix.os }}-${{ matrix.target }}
          env-vars: ImageOS ImageVersion MACOSX_DEPLOYMENT_TARGET SDKROOT DEVELOPER_DIR
      # The firmware and its PlatformIO downloads are cached by firmware-cache.yaml.
      - name: Compile Mac release dependencies
        if: runner.os == 'macOS' && steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked
      - name: Compile Windows release dependencies
        if: runner.os == 'Windows' && steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
