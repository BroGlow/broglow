name: Release

on:
  push:
    tags:
      - "v*"
      # Releases start at v1.0.0; v0.* tags never publish.
      - "!v0.*"

permissions:
  contents: read

jobs:
  source:
    # Match the platform of the reviewed STL/slicer evidence exactly.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.17'
      # tests/test_package_macos.py generates third-party notices with cargo.
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --frozen
      - run: uv run --frozen --group test pytest tests/test_package_macos.py
      - name: Check release version and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python scripts/package-macos.py --release-tag "$RELEASE_TAG" --check-only
      - name: Generate, validate and package the enclosure
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          uv run --frozen --only-group cad \
            python scripts/package-enclosure.py --release-tag "$RELEASE_TAG"
          uv run --frozen --only-group cad python scripts/export-web-model.py --check
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@v7
        with:
          name: enclosure
          if-no-files-found: error
          path: |
            dist/enclosure/broglow-models-${{ github.ref_name }}.zip
            dist/enclosure/broglow-models-${{ github.ref_name }}.zip.sha256

  check:
    needs:
      - source
    uses: ./.github/workflows/ci.yaml

  # The website checks from pages.yaml, without uploading or deploying Pages.
  website:
    needs:
      - source
    # GitHub validates the called workflow's redeploy- and deploy-job permissions
    # at startup, even though check-only skips both; the build job keeps contents: read.
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
    with:
      check-only: true

  mac:
    needs:
      - check
      - website
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.17'
      - run: uv sync --frozen
      - name: Build native Mac app and C3 firmware
        run: |
          cargo build --release --locked
          uv run --frozen flash --build-only
      - name: Package app, firmware and manual
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python scripts/package-macos.py --release-tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/broglow-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            dist/broglow-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

  windows:
    needs:
      - check
      - website
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.17'
      - name: Build Windows tray app and CLI
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package Windows tray app and CLI (no BLE or firmware)
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE=target/x86_64-pc-windows-msvc/release
          test "$("$RELEASE/broglow.exe" --version)" = "broglow ${RELEASE_TAG#v}"
          uv run --no-project --python 3.14 python scripts/third-party-notices.py rust \
            --target x86_64-pc-windows-msvc --output-dir "$RELEASE"
          mkdir dist
          FILE="broglow-${RELEASE_TAG}-x86_64-pc-windows-msvc.tar.gz"
          cp LICENSE "$RELEASE/LICENSE"
          tar czf "dist/$FILE" -C "$RELEASE" broglow.exe LICENSE \
            THIRD-PARTY-NOTICES.md RUST-STANDARD-LIBRARY-COPYRIGHT.html
          cd dist
          sha256sum "$FILE" > "$FILE.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-app
          if-no-files-found: error
          path: dist/*

  release:
    needs:
      - mac
      - windows
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Verify every expected asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for FILE in \
            "broglow-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz" \
            "broglow-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz" \
            "broglow-${RELEASE_TAG}-x86_64-pc-windows-msvc.tar.gz" \
            "broglow-models-${RELEASE_TAG}.zip"; do
            test -s "$FILE"
            sha256sum --check "$FILE.sha256"
          done
          # Every app archive carries its third-party notices.
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            FILE="broglow-${RELEASE_TAG}-${TARGET}.tar.gz"
            PREFIX="broglow-${RELEASE_TAG}-${TARGET}/"
            NAMES="THIRD-PARTY-NOTICES.md RUST-STANDARD-LIBRARY-COPYRIGHT.html"
            if [ "$TARGET" = x86_64-pc-windows-msvc ]; then
              PREFIX=""
            else
              NAMES="$NAMES firmware/esp32-c3-supermini/THIRD-PARTY-NOTICES.md"
            fi
            LISTING="$(tar tzf "$FILE")"
            for NAME in $NAMES; do
              grep -qx "$PREFIX$NAME" <<<"$LISTING"
            done
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            broglow-*.tar.gz
            broglow-*.tar.gz.sha256
            broglow-models-*.zip
            broglow-models-*.zip.sha256
          body: |
            Mac archives contain the native BroGlow app, ESP32-C3 SuperMini firmware and its source, checksums, operating guide and third-party notices. Choose aarch64 for Apple Silicon or x86_64 for Intel. Install with the included guide; the app is not Developer ID notarized.

            The Windows archive contains the graphical system-tray app and CLI in broglow.exe, with USB lamp support, its license and third-party notices. In PowerShell, run `.\broglow.exe install` from its permanent folder to register hooks, enable startup at login and launch the tray app. Use `.\broglow.exe menubar` to launch the tray interface directly, or `.\broglow.exe` for the terminal dashboard. No installer, BLE support, firmware or manuals are included.

            Enclosure: broglow-models-${{ github.ref_name }}.zip holds the five production parts 01–05 in stl/ (print orientation) and step/, plus BUILD.json, with a matching checksum. Print two copies of eye 02. The mascot attaches with four Ø3×2 mm N52 magnets (two in the mascot, two in the traffic light) and can be swapped for any mascot. Slice the STL files for your printer; machine-specific 3MF/G-code is not included. Print settings and assembly steps are in the website guide.

            These assets passed automated checks; release builds do not establish fresh-machine permissions, physical lamp behavior or printed enclosure fit.
          generate_release_notes: true
