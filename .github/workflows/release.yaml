name: Release

on:
  push:
    tags:
      - "v*"
      # Releases start at v1.0.0; v0.* tags never publish.
      - "!v0.*"

permissions:
  contents: read

jobs:
  source:
    # Match the platform of the reviewed STL/slicer evidence exactly.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.17'
      # tests/test_package_macos.py generates third-party notices with cargo.
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --frozen
      - run: uv run --frozen --group test pytest tests/test_package_macos.py
      - name: Check release version and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python scripts/package-macos.py --release-tag "$RELEASE_TAG" --check-only
      # Every archive ships the same C3 images. firmware-cache.yaml builds and
      # packages them on master whenever an input changes; a cache saved by a
      # tag run would be invisible to the next tag, so this job only restores
      # and builds itself on a miss.
      - name: Restore the packaged C3 firmware
        id: firmware
        uses: actions/cache/restore@v6
        with:
          path: dist/firmware
          key: firmware-v1-${{ hashFiles('firmware/esp32-c3-supermini/**', 'scripts/package-firmware.py', 'scripts/firmware-version.py', 'scripts/third-party-notices.py', 'licenses/arduino-esp32-2.0.17-LICENSE.md', 'pyproject.toml', 'uv.lock') }}
      - name: Restore PlatformIO downloads
        if: steps.firmware.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
          key: platformio-v1-macos-15-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('firmware/esp32-c3-supermini/platformio.ini', 'pyproject.toml', 'uv.lock') }}
      - name: Build and package the C3 firmware
        if: steps.firmware.outputs.cache-hit != 'true'
        run: |
          uv run --frozen flash --build-only
          uv run --frozen python scripts/package-firmware.py --output dist/firmware/esp32-c3-supermini
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          if-no-files-found: error
          path: dist/firmware
      - name: Generate, validate and package the enclosure
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          uv run --frozen --only-group cad \
            python scripts/package-enclosure.py --release-tag "$RELEASE_TAG"
          uv run --frozen --only-group cad python scripts/export-web-model.py --check
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@v7
        with:
          name: enclosure
          if-no-files-found: error
          path: |
            dist/enclosure/broglow-models-${{ github.ref_name }}.zip
            dist/enclosure/broglow-models-${{ github.ref_name }}.zip.sha256

  check:
    needs:
      - source
    uses: ./.github/workflows/ci.yaml

  # The website checks from pages.yaml, without uploading or deploying Pages.
  website:
    needs:
      - source
    # GitHub validates the called workflow's redeploy- and deploy-job permissions
    # at startup, even though check-only skips both; the build job keeps contents: read.
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
    with:
      check-only: true

  mac:
    needs:
      - check
      - website
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.os }}-${{ matrix.target }}
          env-vars: ImageOS ImageVersion MACOSX_DEPLOYMENT_TARGET SDKROOT DEVELOPER_DIR
          save-if: false
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.17'
      - run: uv sync --frozen
      - name: Build native Mac app
        run: cargo build --release --locked
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist/firmware
      - name: Package app, firmware and manual
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python scripts/package-macos.py --release-tag "$RELEASE_TAG" --firmware dist/firmware/esp32-c3-supermini
      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/broglow-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            dist/broglow-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

  windows:
    needs:
      - check
      - website
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-latest-x86_64-pc-windows-msvc
          env-vars: ImageOS ImageVersion MACOSX_DEPLOYMENT_TARGET SDKROOT DEVELOPER_DIR
          save-if: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.17'
      - name: Build Windows tray app and CLI
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: target/x86_64-pc-windows-msvc/release/firmware
      - name: Package Windows tray app, CLI and firmware (no BLE)
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE=target/x86_64-pc-windows-msvc/release
          test "$("$RELEASE/broglow.exe" --version)" = "broglow ${RELEASE_TAG#v}"
          test -s "$RELEASE/firmware/esp32-c3-supermini/firmware.bin"
          uv run --no-project --python 3.14 python scripts/third-party-notices.py rust \
            --target x86_64-pc-windows-msvc --output-dir "$RELEASE"
          mkdir dist
          FILE="broglow-${RELEASE_TAG}-x86_64-pc-windows-msvc.tar.gz"
          cp LICENSE "$RELEASE/LICENSE"
          tar czf "dist/$FILE" -C "$RELEASE" broglow.exe LICENSE \
            THIRD-PARTY-NOTICES.md RUST-STANDARD-LIBRARY-COPYRIGHT.html firmware
          cd dist
          sha256sum "$FILE" > "$FILE.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-app
          if-no-files-found: error
          path: dist/*

  release:
    needs:
      - mac
      - windows
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Verify every expected asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for FILE in \
            "broglow-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz" \
            "broglow-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz" \
            "broglow-${RELEASE_TAG}-x86_64-pc-windows-msvc.tar.gz" \
            "broglow-models-${RELEASE_TAG}.zip"; do
            test -s "$FILE"
            sha256sum --check "$FILE.sha256"
          done
          # Every app archive carries its third-party notices.
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            FILE="broglow-${RELEASE_TAG}-${TARGET}.tar.gz"
            PREFIX="broglow-${RELEASE_TAG}-${TARGET}/"
            NAMES="THIRD-PARTY-NOTICES.md RUST-STANDARD-LIBRARY-COPYRIGHT.html"
            NAMES="$NAMES firmware/esp32-c3-supermini/THIRD-PARTY-NOTICES.md firmware/esp32-c3-supermini/firmware.bin"
            if [ "$TARGET" = x86_64-pc-windows-msvc ]; then
              PREFIX=""
            fi
            LISTING="$(tar tzf "$FILE")"
            for NAME in $NAMES; do
              grep -qx "$PREFIX$NAME" <<<"$LISTING"
            done
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            broglow-*.tar.gz
            broglow-*.tar.gz.sha256
            broglow-models-*.zip
            broglow-models-*.zip.sha256
          body: |
            ### Install on macOS

            With [Homebrew](https://brew.sh/) installed:

            **First-time install**

            ```bash
            brew install broglow/tap/broglow
            broglow install
            ```

            **Upgrade**

            ```bash
            brew upgrade broglow
            broglow install
            ```

            Run `broglow install` after installing or upgrading to register agent integrations and start the menu-bar app.
            A lamp updates its firmware over USB from Lamp details in the app, or with `broglow flash`.

            [Setup guide](https://broglow.github.io/broglow/docs/)

            <details>
            <summary>Manual downloads, Windows setup and enclosure files</summary>

            **macOS downloads**

            Choose the archive for your Mac from the assets below:

            - Apple Silicon: `broglow-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz`
            - Intel: `broglow-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz`

            Both contain the native BroGlow app, ESP32-C3 SuperMini firmware and its source, checksums, operating guide and third-party notices. Follow the included guide to install. The app is not Developer ID signed or notarized. The app writes the firmware with `broglow flash`; no Python toolchain is needed.

            **Windows (x64)**

            Download `broglow-${{ github.ref_name }}-x86_64-pc-windows-msvc.tar.gz` and extract it to a permanent folder. Open PowerShell in that folder and run:

            ```powershell
            .\broglow.exe install
            ```

            This registers hooks, enables startup at login and launches the system-tray app. Use `.\broglow.exe menubar` to launch the tray interface directly, or `.\broglow.exe` for the terminal dashboard. The archive includes USB lamp support, the ESP32-C3 firmware images with their source and licenses (`.\broglow.exe flash` writes them), its license and third-party notices; no installer, BLE support or manuals.

            **3D-printed enclosure (optional)**

            Download `broglow-models-${{ github.ref_name }}.zip` for the five production parts 01–05 in `stl/` (print orientation) and `step/`, plus `BUILD.json`. Print two copies of eye 02. The swappable mascot attaches with four Ø3×2 mm N52 magnets (two in the mascot, two in the traffic light). Slice the STL files for your printer; machine-specific 3MF/G-code is not included. See the [printing and assembly guide](https://broglow.github.io/broglow/docs/printing/).

            The enclosure is also available on [Printables](https://www.printables.com/model/1884645) and [MakerWorld](https://makerworld.com/models/3468773), with a shared print profile on MakerWorld. The model listings use CC BY 4.0; this repository retains its MIT license.

            GitHub's **Source code** downloads contain sources and instructions; ready-to-print files are in the separate enclosure ZIP.

            **Checksums and verification**

            Each archive has a matching `.sha256` file.
            These assets passed automated checks; release builds do not establish fresh-machine permissions, physical lamp behavior or printed enclosure fit.

            </details>
          generate_release_notes: true
