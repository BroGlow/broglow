name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  source:
    # Match the platform of the reviewed STL/slicer evidence exactly.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python tests/package_macos.py
      - name: Check release version and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package-macos.py --release-tag "$RELEASE_TAG" --check-only
      - name: Install pinned CAD toolchain
        run: python -m pip install -r models/clawlight/requirements.txt
      - name: Generate, validate and package the enclosure
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/package-enclosure.py --release-tag "$RELEASE_TAG"
          python scripts/export-web-model.py --check
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@v7
        with:
          name: enclosure
          if-no-files-found: error
          path: |
            dist/enclosure/clawlight-enclosure-${{ github.ref_name }}.zip
            dist/enclosure/clawlight-enclosure-${{ github.ref_name }}.zip.sha256

  check:
    needs:
      - source
    uses: ./.github/workflows/ci.yaml

  mac:
    needs:
      - check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install platformio==6.2.0
      - name: Build native Mac app and C3 firmware
        run: |
          cargo build --release --locked
          pio run -d firmware/esp32-c3-supermini
      - name: Package app, firmware and manual
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package-macos.py --release-tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/clawlight-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            dist/clawlight-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

  windows:
    needs:
      - check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows tray app and CLI
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package Windows tray app and CLI (no BLE or firmware)
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(target/x86_64-pc-windows-msvc/release/clawlight.exe --version)" = "clawlight ${RELEASE_TAG#v}"
          mkdir dist
          FILE="clawlight-cli-${RELEASE_TAG}-x86_64-pc-windows-msvc.tar.gz"
          cp LICENSE target/x86_64-pc-windows-msvc/release/LICENSE
          tar czf "dist/$FILE" -C target/x86_64-pc-windows-msvc/release clawlight.exe LICENSE
          cd dist
          sha256sum "$FILE" > "$FILE.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-app
          if-no-files-found: error
          path: dist/*

  release:
    needs:
      - mac
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Verify every expected asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for FILE in \
            "clawlight-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz" \
            "clawlight-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz" \
            "clawlight-cli-${RELEASE_TAG}-x86_64-pc-windows-msvc.tar.gz" \
            "clawlight-enclosure-${RELEASE_TAG}.zip"; do
            test -s "$FILE"
            sha256sum --check "$FILE.sha256"
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            clawlight-*.tar.gz
            clawlight-*.tar.gz.sha256
            clawlight-enclosure-*.zip
            clawlight-enclosure-*.zip.sha256
          body: |
            Mac archives contain the native ClawLight app, ESP32-C3 SuperMini firmware and its source, checksums and operating guide. Choose aarch64 for Apple Silicon or x86_64 for Intel. Install with the included guide; the app is not Developer ID notarized.

            The Windows archive contains the graphical system-tray app and CLI in clawlight.exe, with USB lamp support. In PowerShell, run `.\clawlight.exe install` from its permanent folder to register hooks, enable startup at login and launch the tray app. Use `.\clawlight.exe menubar` to launch the tray interface directly, or `.\clawlight.exe` for the terminal dashboard. No installer, BLE support, firmware or manuals are included.

            The enclosure ZIP contains the accepted release candidate: STL, STEP, CAD source, print guide and validation reports.

            These assets passed automated checks; release builds do not establish fresh-machine permissions, physical lamp behavior or printed enclosure fit.
          generate_release_notes: true
