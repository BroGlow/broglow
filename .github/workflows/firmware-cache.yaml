name: Cache the C3 firmware

# Builds and packages the firmware on the default branch whenever one of its
# inputs changes, and saves the result under the key the release restores.
# A cache saved during a tag run is invisible to every other tag, so only a
# cache saved here is ever reused across releases.
on:
  push:
    branches:
      - master
    paths:
      - firmware/esp32-c3-supermini/**
      - scripts/package-firmware.py
      - scripts/firmware-version.py
      - scripts/third-party-notices.py
      - licenses/arduino-esp32-2.0.17-LICENSE.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/firmware-cache.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-cache
  cancel-in-progress: false

jobs:
  firmware:
    # The same runner and Python as the release's source job, so the PlatformIO
    # download cache is shared with it too.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Look up the packaged C3 firmware
        id: firmware
        uses: actions/cache/restore@v6
        with:
          path: dist/firmware
          key: firmware-v1-${{ hashFiles('firmware/esp32-c3-supermini/**', 'scripts/package-firmware.py', 'scripts/firmware-version.py', 'scripts/third-party-notices.py', 'licenses/arduino-esp32-2.0.17-LICENSE.md', 'pyproject.toml', 'uv.lock') }}
          lookup-only: true
      - uses: actions/setup-python@v7
        if: steps.firmware.outputs.cache-hit != 'true'
        id: python
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.firmware.outputs.cache-hit != 'true'
        with:
          version: '0.12.17'
      - if: steps.firmware.outputs.cache-hit != 'true'
        run: uv sync --frozen
      - name: Restore PlatformIO downloads
        if: steps.firmware.outputs.cache-hit != 'true'
        id: platformio
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
          key: platformio-v1-macos-15-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('firmware/esp32-c3-supermini/platformio.ini', 'pyproject.toml', 'uv.lock') }}
      - name: Build and package the C3 firmware
        if: steps.firmware.outputs.cache-hit != 'true'
        run: |
          uv run --frozen flash --build-only
          uv run --frozen python scripts/package-firmware.py --output dist/firmware/esp32-c3-supermini
      - name: Save PlatformIO downloads
        if: steps.firmware.outputs.cache-hit != 'true' && steps.platformio.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
          key: ${{ steps.platformio.outputs.cache-primary-key }}
      - name: Save the packaged C3 firmware
        if: steps.firmware.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist/firmware
          key: ${{ steps.firmware.outputs.cache-primary-key }}
