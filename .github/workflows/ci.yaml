name: CI

on:
  push:
    branches:
      - master
  pull_request:
  # Lets release.yaml reuse this exact suite as a pre-release gate.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

# One run per branch/PR; superseded PR runs are cancelled, master runs never are.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.17'
          enable-cache: true
          cache-suffix: uv-0.12.17
          save-cache: false
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --frozen --group dev
      - name: Python formatting (Black)
        run: uv run --frozen --group dev black --check --diff .

  firmware:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # The packaging test generates Rust notices with cargo and the toolchain's
      # standard library notices.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.17'
          enable-cache: true
          cache-suffix: uv-0.12.17
          # This job installs the full Linux dependency union; PRs and tags only restore.
          save-cache: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: uv sync --frozen --group dev
      - name: Firmware formatting (Google)
        run: uv run --frozen --group dev clang-format --dry-run --Werror firmware/esp32-c3-supermini/src/*.cpp firmware/esp32-c3-supermini/tests/*.cpp
      - run: uv run --frozen --group test pytest tests firmware/esp32-c3-supermini/tests
      - run: uv run --frozen python scripts/check-generated-artifacts.py
      - run: uv run --frozen python assets/icons/render.py --check
      # No PlatformIO builds here: its registry fails downloads intermittently.
      # Release packaging builds the firmware; contributors build it locally.

  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # clippy + tests run per-OS: menubar/popover/terminal code is cfg-gated, so
  # only a matrix actually compiles (and lints) every platform's code paths.
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # tao/tray-icon need gtk + appindicator, serialport needs libudev.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the end-to-end suite in tests/: the hook backend and auto-namer
      # driven through the real binary (unix), install/uninstall (Linux), and
      # CLI smoke tests (all platforms).
      - name: Test
        run: cargo test --locked

  # opencode↔broglow integration: drive the REAL embedded plugin
  # (assets/opencode-plugin.js) with opencode's actual event shapes and assert
  # the state.json the built binary writes — the boundary the Rust suite can't
  # cover. A dedicated job so it's a distinct, required PR check. Linux only: it
  # sandboxes state via $HOME like the Rust suite.
  js-integration:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Building the binary links tao/tray-icon (gtk + appindicator) and
      # serialport (libudev), same as the test job.
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build broglow binary
        run: cargo build --locked

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: opencode plugin integration tests
        run: node --test tests/js/*.test.mjs

      - name: Homepage tests
        run: node --test site/*.test.cjs
