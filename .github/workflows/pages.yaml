name: Website

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README*.md'
      - 'CONTRIBUTING*.md'
      - 'AGENTS*.md'
      - 'CLAUDE*.md'
      - 'assets/icons/**'
      - 'scripts/export-web-model.py'
      - 'models/clawlight/*.py'
      - 'models/clawlight/requirements.txt'
      - 'models/clawlight/PRINT_GUIDE*.md'
      - 'models/clawlight/parts.json'
      - 'Cargo.toml'
      - '.github/workflows/pages.yaml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README*.md'
      - 'CONTRIBUTING*.md'
      - 'AGENTS*.md'
      - 'CLAUDE*.md'
      - 'assets/icons/**'
      - 'scripts/export-web-model.py'
      - 'models/clawlight/*.py'
      - 'models/clawlight/requirements.txt'
      - 'models/clawlight/PRINT_GUIDE*.md'
      - 'models/clawlight/parts.json'
      - 'Cargo.toml'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: site/requirements-docs.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install -r site/requirements-docs.txt
      - name: Check language and copying
        run: |
          python site/check-translations.py
          node site/i18n.test.cjs
          node site/model-preview.test.cjs
          node site/docs-language.test.cjs
          node site/docs-copy.test.cjs
          python site/pages.test.py
          python scripts/export-web-model.py --check
          python scripts/export-web-model.py --exploded --check
      - name: Build and check the complete website
        env:
          WEBSITE_REPOSITORY: ${{ github.repository }}
        run: |
          python site/pages.py --repository "$WEBSITE_REPOSITORY"
          python site/check-links.py --site-dir site/_pages
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/_pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
