name: Website

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - 'README*.md'
      - 'CONTRIBUTING*.md'
      - 'AGENTS*.md'
      - 'CLAUDE*.md'
      - 'assets/icons/**'
      - 'assets/popover.html'
      - 'assets/popover/**'
      - 'tests/js/lamp-status.test.mjs'
      - 'tests/js/popover-library.test.mjs'
      - 'scripts/export-web-model.py'
      - 'models/magnetic/**'
      - 'models/broglow/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Cargo.toml'
      - '.github/workflows/pages.yaml'
  pull_request:
    paths:
      - 'site/**'
      - 'README*.md'
      - 'CONTRIBUTING*.md'
      - 'AGENTS*.md'
      - 'CLAUDE*.md'
      - 'assets/icons/**'
      - 'assets/popover.html'
      - 'assets/popover/**'
      - 'tests/js/lamp-status.test.mjs'
      - 'tests/js/popover-library.test.mjs'
      - 'scripts/export-web-model.py'
      - 'models/magnetic/**'
      - 'models/broglow/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Cargo.toml'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:
  # The published enclosure checksum is embedded at build time; the redeploy job below
  # restarts this workflow on the default branch (tags cannot deploy to github-pages).
  release:
    types:
      - published
  # Lets release.yaml run the same website checks as a pre-release gate.
  workflow_call:
    inputs:
      check-only:
        description: Build and check the website without uploading or deploying Pages.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yaml --ref "$BRANCH"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.17'
          enable-cache: true
          cache-suffix: uv-0.12.17
          save-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check language and copying
        run: |
          uv run --frozen --only-group docs python site/check-translations.py
          node --test site/*.test.cjs
          node --test tests/js/lamp-status.test.mjs tests/js/popover-library.test.mjs
          uv run --frozen --only-group test pytest site/test_pages.py
          uv run --no-project --python 3.14 python scripts/export-web-model.py --check
          uv run --no-project --python 3.14 python scripts/export-web-model.py --exploded --check
      - name: Build and check the complete website
        env:
          WEBSITE_REPOSITORY: ${{ github.repository }}
        run: |
          uv run --frozen --only-group docs python site/pages.py --repository "$WEBSITE_REPOSITORY"
          uv run --no-project --python 3.14 python site/check-links.py --site-dir site/_pages
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && !inputs.check-only
        with:
          path: site/_pages

  deploy:
    if: github.event_name != 'pull_request' && !inputs.check-only && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs:
      - build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
