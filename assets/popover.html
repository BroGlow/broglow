<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* Tray popover, from "Tray Menu Designs" 1a (macOS) / 1c (Windows 11).
   The window is sized exactly to the card; the drop shadow is the native
   window shadow (a CSS shadow in the transparent margin composites against
   white and shows as a pale halo), and the transparent window corners give
   the rounded shape. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: transparent; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  -webkit-user-select: none; user-select: none;
  cursor: default;
}
/* Windows: paint the canvas card-dark instead of transparent. Any mismatch
   between the client area and the card (window-frame padding quirks, resize
   races) then shows as card background instead of an opaque white gutter,
   and DWM rounds the window corners for us. */
body.win { font-family: 'Segoe UI', system-ui, sans-serif; background: #202020; }

.pop {
  width: 338px;
  max-height: 720px;
  display: flex;
  flex-direction: column;
  /* The design's rgba+backdrop-blur can't blur the desktop behind a
     transparent window, so stay effectively opaque to avoid text bleed. */
  background: rgb(32,32,37);
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,.14);
  overflow: hidden;
  color: rgba(255,255,255,.92);
}
body.win .pop {
  width: 344px;
  background: #202020;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.08);
  color: #fff;
}

.pophead { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px 14px; }
.pophead img { width: 22px; height: 22px; image-rendering: pixelated; }
.apptitle { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agg { font-size: 11px; color: rgba(255,255,255,.5); white-space: nowrap; }
.chips { display: flex; gap: 6px; }
.chip {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
  background: rgba(255,255,255,.08); color: rgba(255,255,255,.75);
}

.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dgreen { background: #34c759 } .dyellow { background: #ff9f0a }
.dred { background: #ff453a } .dgray { background: #8e8e93 }

.grp { padding: 2px 6px 6px 6px; min-height: 0; max-height: 480px; overflow-y: auto; }
.grp::-webkit-scrollbar { width: 8px; }
.grp::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }
.grplabel {
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: rgba(255,255,255,.35); padding: 6px 10px 3px 10px;
}
body.win .grplabel { color: rgba(255,255,255,.45); }

.srow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
.srow:active { filter: brightness(.85); }
body.win .srow { border-radius: 5px; padding: 9px 12px; }
.srow:hover { background: rgba(255,255,255,.08); }
body.win .srow:hover { background: rgba(255,255,255,.06); }
.sinfo { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.sname { font-size: 13px; font-weight: 590; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.smeta { font-size: 11px; color: rgba(255,255,255,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Per-harness tag; rendered only for non-Claude sessions (opencode, …). */
.badge { display: inline-block; font-size: 9px; font-weight: 700; line-height: 1.4;
  color: #c678dd; background: rgba(198,120,221,.16); border-radius: 4px;
  padding: 0 5px; margin-right: 6px; vertical-align: 1px; }
body.win .badge { color: #c9a0ff; background: rgba(201,160,255,.16); }
.time { font-size: 11px; color: rgba(255,255,255,.4); flex-shrink: 0; font-variant-numeric: tabular-nums; }

.focusbtn {
  font-size: 11px; font-weight: 600; color: #fff; background: #3577f6;
  border-radius: 5px; padding: 3px 9px; flex-shrink: 0; border: none;
  font-family: inherit; cursor: default;
}
.focusbtn:active { filter: brightness(.85); }
body.win .focusbtn { background: #4cc2ff; color: #0b2a3a; }

.helprow { background: rgba(255,69,58,.12); }
.helprow:hover { background: rgba(255,69,58,.2); }
.helprow .sname { color: #ff8a80; }
body.win .helprow { background: rgba(255,153,164,.1); }
body.win .helprow:hover { background: rgba(255,153,164,.18); }
body.win .helprow .sname { color: #ff99a4; }

/* Settings view — swapped into the same scroll area as the session groups. */
.optrow { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 7px; }
body.win .optrow { border-radius: 5px; padding: 9px 12px; }
.optrow:hover { background: rgba(255,255,255,.08); }
body.win .optrow:hover { background: rgba(255,255,255,.06); }
.radio {
  width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
  border: 1.5px solid rgba(255,255,255,.4);
}
.radio.rsel { border: 4.5px solid #3577f6; }
body.win .radio.rsel { border-color: #4cc2ff; }
.setdesc { white-space: normal; line-height: 1.35; }
.optrow input { margin-top: 2px; accent-color: #3577f6; }
body.win .optrow input { accent-color: #4cc2ff; }

/* Usage section (design 1a/1c) — sits between the session groups and the
   footer. Plan mode: 5h-block + week bars; API mode: per-model cost bar. */
.usec {
  padding: 9px 14px 11px 14px; border-top: 1px solid rgba(255,255,255,.1);
  display: flex; flex-direction: column; gap: 5px;
}
.usec[hidden] { display: none; }
body.win .usec { border-top: 1px solid rgba(255,255,255,.08); }
.ulhead {
  display: flex; align-items: baseline; gap: 5px;
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: rgba(255,255,255,.38);
}
.uval { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.9); letter-spacing: 0; text-transform: none; }
.usub { font-size: 11px; font-weight: 400; color: rgba(255,255,255,.42); letter-spacing: 0; text-transform: none; }
.ubar { height: 5px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; display: flex; gap: 2px; }
.ufill { background: #3577f6; border-radius: 99px; }
.uweek { opacity: .55; }
.useg { height: 100%; }
body.win .ubar { border-radius: 2px; }
body.win .ufill { background: #4cc2ff; border-radius: 2px; }
.mopus { background: #bf5af2 } .msonnet { background: #3577f6 }
.mhaiku { background: #40c8e0 } .mother { background: #8e8e93 }
body.win .msonnet { background: #4cc2ff; }
.urow { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: rgba(255,255,255,.75); }
.udot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.uname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.utok { color: rgba(255,255,255,.4); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ucost { color: rgba(255,255,255,.88); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.mt4 { margin-top: 4px; }

.emptybox {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 26px 16px; color: rgba(255,255,255,.45); font-size: 12px;
}
.emptybox img { width: 26px; height: 26px; opacity: .5; filter: grayscale(1); image-rendering: pixelated; }

.popfoot {
  display: flex; align-items: center; gap: 6px; padding: 9px 12px;
  border-top: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03);
}
body.win .popfoot { border-top: 1px solid rgba(255,255,255,.08); background: #1b1b1b; }
.pbtn {
  font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 6px;
  background: rgba(255,255,255,.09); color: rgba(255,255,255,.85);
  border: none; font-family: inherit; white-space: nowrap; cursor: default;
  display: flex; align-items: center; gap: 5px;
}
.pbtn:hover { background: rgba(255,255,255,.14); }
.pbtn:active { filter: brightness(.8); }
.pbtnpri { background: #3577f6; color: #fff; }
.pbtnpri:hover { background: #4285f8; }
body.win .pbtnpri { background: #4cc2ff; color: #0b2a3a; }
body.win .pbtnpri:hover { background: #63cbff; }
.pbtnghost { background: transparent; color: rgba(255,255,255,.55); }
.pbtnghost:hover { background: rgba(255,255,255,.08); }
.pbtn[disabled] { opacity: .55; pointer-events: none; }
.pbtn[hidden] { display: none; }
.f1 { flex: 1; }
/* Footer lamp indicator opens details without changing lamp control. */
.lampbtn { gap: 6px; padding-left: 9px; padding-right: 9px; }
.lampbtn .dot { width: 7px; height: 7px; }
.lampbtn.lon { color: rgba(255,255,255,.8); }
.lamptop { padding: 7px 10px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lamptop #lampsummary { font-size: 13px; font-weight: 600; }
.lamptop #lamptransport { color: rgba(255,255,255,.5); font-size: 11px; }
.lamplist { padding: 0 10px 12px; }
.lampitem { border: 1px solid rgba(255,255,255,.12); border-radius: 7px; margin-bottom: 6px; }
.lampheading { display: grid; grid-template-columns: 1fr auto 10px; gap: 8px; align-items: center; padding: 10px; font-size: 12px; cursor: pointer; list-style: none; }
.lampheading::-webkit-details-marker { display: none; }
.lampheading:hover { background: rgba(255,255,255,.05); }
summary:focus-visible, .lampbtn:focus-visible { outline: 2px solid #6295ff; outline-offset: -2px; border-radius: 6px; }
.lampstate { font-size: 11px; color: #ffbc66; }
.lampstate.connected { color: #66d987; }
.lampstate.disabled { color: rgba(255,255,255,.5); }
.lampstate.error, .lampstate.unavailable { color: #ff8a80; }
.lampchevron { color: rgba(255,255,255,.5); font-size: 16px; transition: transform .1s; }
.lampitem[open] .lampchevron { transform: rotate(90deg); }
.lampitem dl { padding: 0 10px 10px; font-size: 11px; line-height: 1.45; -webkit-user-select: text; user-select: text; }
.lampitem dt { color: rgba(255,255,255,.5); margin-top: 7px; }
.lampitem dd { color: rgba(255,255,255,.8); overflow-wrap: anywhere; }
.lampitem dd.lampid { font-family: ui-monospace, monospace; }
.lampforget { padding: 0 10px 10px; }
.lamperror { margin: 0 10px 12px; color: #ff8a80; font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; }
.lamptechnical { margin: 0 10px 12px; font-size: 11px; color: rgba(255,255,255,.6); }
.lamptechnical summary { cursor: pointer; padding: 5px 0; }
.lampdetail { padding: 7px 10px 12px; color: rgba(255,255,255,.65); font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-line; -webkit-user-select: text; user-select: text; }
.lampactions { padding: 0 10px 10px; }
.brightness { padding: 0 10px 12px; color: rgba(255,255,255,.8); font-size: 12px; }
.brightness label { display: flex; justify-content: space-between; margin-bottom: 7px; }
.brightness input { width: 100%; accent-color: #3577f6; }
.brightness p, .lampforget p { margin-top: 5px; color: rgba(255,255,255,.5); font-size: 11px; line-height: 1.4; }
body.win .brightness input { accent-color: #4cc2ff; }
.pophead, .popfoot, .usec { flex-shrink: 0; }
</style>
</head>
<body class="__PLATFORM__">
<div class="pop" id="card">
  <div class="pophead">
    <img id="hicon" src="__ICON_NONE__" alt="">
    <div class="sinfo">
      <span class="apptitle">clawlight</span>
      <span class="agg" id="aggline">No live sessions</span>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="grp" id="groups"></div>
  <div class="usec" id="usage" hidden></div>
  <div class="popfoot">
    <button class="pbtn pbtnpri" id="dashboardbtn" data-cmd="dashboard" hidden>Dashboard</button>
    <button class="pbtn" id="settingsbtn" data-local="settings">Settings</button>
    <span class="f1"></span>
    <button class="pbtn pbtnghost lampbtn" id="lampbtn" data-local="lamp"></button>
    <button class="pbtn pbtnghost" data-cmd="quit">Quit</button>
  </div>
</div>
<script>
'use strict';
const ICONS = {
  red: "__ICON_RED__",
  yellow: "__ICON_YELLOW__",
  green: "__ICON_GREEN__",
  none: "__ICON_NONE__",
};
const GROUPS = [
  { status: 'needs_help', label: 'Needs help', dot: 'dred' },
  { status: 'active',     label: 'Working',    dot: 'dgreen' },
  { status: 'inactive',   label: 'Paused',     dot: 'dyellow' },
];

const YELLOW_OPTIONS = [
  { value: 'any_inactive', title: 'Always show yellow',
    desc: 'Yellow whenever any session is idle, even while others are working.' },
  { value: 'active_wins', title: 'Green while working',
    desc: 'Stay green while any session is working; yellow only when all are idle.' },
];

// Usage tracking is opt-in. "Off" tracks nothing; the other two turn it on and
// pick the readout. Turning it on lets clawlight read local Claude Code
// transcripts (and, for plan %, its usage endpoint) — hence the off default.
const USAGE_OPTIONS = [
  { value: 'off', title: 'Off',
    desc: "Don't track usage." },
  { value: 'plan', title: 'Plan percentages',
    desc: 'Rate-limit view: how much of the 5-hour block and week is used.' },
  { value: 'api', title: 'API dollars',
    desc: "Cost view: today's per-model tokens and API-equivalent dollars." },
];

const FAMILY_CLASS = { opus: 'mopus', sonnet: 'msonnet', haiku: 'mhaiku' };

let state = { aggregate: 'none', sessions: [], settings: { yellowMode: 'any_inactive' },
              lamp: { present: false, enabled: false, transport: 'usb', state: 'disabled' } };
let view = 'sessions';

function post(msg) { window.ipc.postMessage(JSON.stringify(msg)); }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}

function fmtTokens(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'k';
  return String(n);
}

function fmtCost(c) {
  return '$' + (c >= 100 ? c.toFixed(0) : c.toFixed(2));
}

/* Usage section, per design 1a/1c. Plan mode: 5h-block + week bars from the
   plan endpoint, with today's token/$ line under them (or alone, when the
   percentages are unavailable). API mode: per-model cost bar + rows. */
function renderUsage() {
  const el = document.getElementById('usage');
  const u = state.usage;
  const mode = (state.settings && state.settings.billingMode) || 'plan';
  const havePlan = u && u.fiveHourPct != null;
  if (view !== 'sessions' || !u || (!havePlan && !u.todayTokens)) {
    el.hidden = true;
    el.innerHTML = '';
    return;
  }

  const todayLine =
    `Today ≈ ${fmtTokens(u.todayTokens)} tokens · ~${fmtCost(u.todayCost)} API-equivalent`;
  let html = '';
  if (mode === 'plan' && havePlan) {
    const pct = v => Math.max(0, Math.min(100, v));
    html +=
      `<div class="ulhead"><span>Usage · 5h block</span><span class="f1"></span>` +
      `<span class="uval">${Math.round(u.fiveHourPct)}%</span>` +
      (u.fiveHourReset ? `<span class="usub">resets ${esc(u.fiveHourReset)}</span>` : '') +
      `</div><div class="ubar"><span class="ufill" style="width:${pct(u.fiveHourPct)}%"></span></div>`;
    if (u.weekPct != null) {
      html +=
        `<div class="ulhead mt4"><span>Week</span><span class="f1"></span>` +
        `<span class="uval">${Math.round(u.weekPct)}%</span>` +
        (u.weekReset ? `<span class="usub">resets ${esc(u.weekReset)}</span>` : '') +
        `</div><div class="ubar"><span class="ufill uweek" style="width:${pct(u.weekPct)}%"></span></div>`;
    }
    html += `<div class="usub mt4">${todayLine}</div>`;
  } else if (mode === 'plan') {
    // Plan mode without plan data (API-key install, no creds): today only.
    html +=
      `<div class="ulhead"><span>Usage · today</span><span class="f1"></span>` +
      `<span class="uval">~${fmtCost(u.todayCost)}</span></div>` +
      `<div class="usub">≈ ${fmtTokens(u.todayTokens)} tokens · API-equivalent estimate</div>`;
  } else {
    html +=
      `<div class="ulhead"><span>Usage · today</span><span class="f1"></span>` +
      `<span class="uval">${fmtCost(u.todayCost)}</span></div>`;
    const models = u.models || [];
    // Segment widths by cost share; fall back to token share when today is
    // all cache reads on unpriced models.
    const total = models.reduce((a, m) => a + m.cost, 0);
    const share = total > 0
      ? m => m.cost / total
      : m => m.tokens / Math.max(1, u.todayTokens);
    html += `<div class="ubar">` + models.map(m =>
      `<span class="useg ${FAMILY_CLASS[m.family] || 'mother'}"` +
      ` style="width:${Math.max(1.5, share(m) * 100)}%"></span>`
    ).join('') + `</div>`;
    models.forEach((m, i) => {
      html +=
        `<div class="urow${i === 0 ? ' mt4' : ''}">` +
        `<span class="udot ${FAMILY_CLASS[m.family] || 'mother'}"></span>` +
        `<span class="uname">${esc(m.name)}</span><span class="f1"></span>` +
        `<span class="utok">${fmtTokens(m.tokens)} tok</span>` +
        `<span class="ucost">${fmtCost(m.cost)}</span></div>`;
    });
  }
  el.innerHTML = html;
  el.hidden = false;
}

function lampState(status) {
  return ({ connected: 'Connected', connecting: 'Connecting', searching: 'Looking for lamp',
    error: 'Needs attention', unavailable: 'No recent response', disabled: 'Off' })[status] || 'No recent response';
}
let pendingForgetId = null, configActionError = '';
window.__configActionResult = error => {
  pendingForgetId = null;
  configActionError = error || '';
  render();
};

let previewPointer = null, previewTimer = null, previewKeepAlive = null;
let pendingPreview = null, lastPreviewAt = -Infinity;
function brightnessPercent(value) {
  const percent = Number(value);
  return String(value).trim() !== '' && Number.isInteger(percent) && percent >= 0 && percent <= 100 ? percent : null;
}
function canPreviewBrightness() {
  const lamp = state.lamp || {};
  return view === 'lamp' && lamp.transport === 'ble' && lamp.enabled && lamp.state === 'connected' &&
    (lamp.devices || []).some(device => device.state === 'connected');
}
function flushBrightnessPreview() {
  clearTimeout(previewTimer);
  previewTimer = null;
  const percent = pendingPreview;
  pendingPreview = null;
  if (percent !== null && canPreviewBrightness()) {
    post({ cmd: 'preview_brightness', percent });
    lastPreviewAt = Date.now();
  }
}
function previewBrightness(value, force = false) {
  const percent = brightnessPercent(value);
  if (percent === null) return;
  if (!canPreviewBrightness()) {
    clearTimeout(previewTimer);
    previewTimer = pendingPreview = null;
    return;
  }
  pendingPreview = percent;
  const wait = 80 - (Date.now() - lastPreviewAt);
  if (force || wait <= 0) flushBrightnessPreview();
  else if (previewTimer === null) previewTimer = setTimeout(flushBrightnessPreview, wait);
}
function stopBrightnessPreview() {
  if (previewPointer !== null || pendingPreview !== null) {
    previewBrightness(document.getElementById('brightness').value, true);
  }
  clearTimeout(previewTimer);
  clearInterval(previewKeepAlive);
  previewPointer = previewTimer = previewKeepAlive = pendingPreview = null;
}

/* Connection comes from worker writes, never from a nearby advertisement or
   enabled setting. Diagnostics and controls live in the Lamps view. */
function renderLamp() {
  const l = state.lamp || {};
  const el = document.getElementById('lampbtn');
  const wireless = l.transport === 'ble';
  const status = l.enabled ? (l.state || 'unavailable') : 'disabled';
  const devices = l.devices || [];
  const connectedCount = l.enabled && status === 'connected' ? devices.filter(device => device.state === 'connected').length : 0;
  const connected = status === 'connected' && (!wireless || connectedCount > 0);
  const plural = wireless && l.selected_count > 1;
  let dot = null, label = plural ? 'Lamps' : 'Lamp', cmd = 'set_led', enabled = !l.enabled;
  if (l.enabled) {
    dot = connected ? 'dgreen' : (status === 'error' || status === 'unavailable' ? 'dred' : 'dyellow');
    if (plural) label += ` ${connectedCount}/${l.selected_count}`;
  } else {
    label += ' off';
    if (!l.present && !wireless) { cmd = 'get_lamp'; enabled = undefined; }
  }
  el.className = 'pbtn pbtnghost lampbtn' + (connected ? ' lon' : '');
  el.title = `${label} — ${lampState(connected ? 'connected' : status === 'connected' ? 'unavailable' : status)}. View lamp details.`;
  el.setAttribute('aria-label', el.title);
  el.setAttribute('aria-expanded', String(view === 'lamp'));
  el.innerHTML = (dot ? `<span class="dot ${dot}" aria-hidden="true"></span>` : '') + esc(label);
  if (view === 'lamp') {
    document.getElementById('lamptransport').textContent = wireless ? 'Bluetooth' : 'USB';
    document.getElementById('lampsummary').textContent = wireless && !l.selected_count ? 'No lamps added' :
      !l.enabled ? 'Updates paused' : plural ? `${connectedCount} of ${l.selected_count} connected` :
      lampState(connected ? 'connected' : status === 'connected' ? 'unavailable' : status);
    const rows = wireless ? devices : [{ id: 'usb', state: status, detail: l.detail }];
    const list = document.getElementById('lamplist');
    const ids = JSON.stringify([l.transport, ...rows.map(device => device.id)]);
    // Preserve native disclosure state, focus and text selection across heartbeats.
    if (list.dataset.ids !== ids) {
      list.innerHTML = rows.map((device, i) =>
        `<details class="lampitem"><summary class="lampheading">` +
        `<span>${wireless ? 'Lamp ' + (i + 1) : 'USB lamp'}</span>` +
        `<span class="lampstate" id="lampstate-${i}"></span>` +
        `<span class="lampchevron" aria-hidden="true">›</span></summary>` +
        `<dl><dt>${wireless ? 'Device ID' : 'Connection'}</dt><dd class="lampid" id="lampid-${i}"></dd>` +
        `<dt>Diagnostic</dt><dd id="lampdiagnostic-${i}"></dd></dl>` +
        (wireless ? `<div class="lampforget"><button class="pbtn pbtnghost" type="button" id="lampforget-${i}" ` +
          `aria-label="Forget lamp ${i + 1}" aria-describedby="lampforgethelp-${i}">Forget lamp</button>` +
          `<p id="lampforgethelp-${i}">Stops ClawLight reconnecting. Pairing stays on the lamp and Mac.</p></div>` : '') +
        `</details>`
      ).join('');
      list.dataset.ids = ids;
    }
    rows.forEach((device, i) => {
      const deviceState = !l.enabled ? 'disabled' :
        device.state === 'connected' && status !== 'connected' ? status : (device.state || status);
      const cell = document.getElementById('lampstate-' + i);
      cell.textContent = lampState(deviceState);
      cell.className = 'lampstate ' + (['connected', 'disabled', 'error', 'unavailable'].includes(deviceState) ? deviceState : '');
      const id = document.getElementById('lampid-' + i);
      const diagnostic = document.getElementById('lampdiagnostic-' + i);
      const identifier = wireless ? device.id : 'USB cable';
      if (id.textContent !== identifier) id.textContent = identifier;
      if (diagnostic.textContent !== (device.detail || '')) diagnostic.textContent = device.detail || '';
      if (wireless) {
        const forget = document.getElementById('lampforget-' + i);
        forget.dataset.cmd = 'forget_lamp';
        forget.dataset.id = device.id;
        forget.disabled = pendingForgetId !== null;
        forget.textContent = pendingForgetId === device.id ? 'Forgetting…' : 'Forget lamp';
      }
    });
    const error = document.getElementById('lamperror');
    error.textContent = configActionError;
    error.hidden = !configActionError;
    document.getElementById('lampdetail').textContent = wireless && !l.selected_count ?
      'Connect the lamp by USB, then run clawlight ble pair to set it up. For button setup, hold BOOT for 3 seconds after startup, then use clawlight ble scan and clawlight ble add <ID>.' : (l.detail || '');
    const control = document.getElementById('lampcontrol');
    control.dataset.cmd = cmd;
    if (enabled === undefined) delete control.dataset.enabled;
    else control.dataset.enabled = String(enabled);
    control.textContent = cmd === 'get_lamp' ? 'Get a lamp ↗' : (l.enabled ? 'Disable' : 'Enable') + (plural ? ' lamps' : ' lamp');
    document.getElementById('brightnesscontrol').hidden = !wireless;
    document.getElementById('brightnesshint').textContent = !wireless ? 'Brightness control requires Bluetooth.' :
      canPreviewBrightness() ? 'All three lights preview this level while you adjust it, then return to status after 2 seconds. Saved for all lamps.' :
      (l.enabled ? 'Connect a lamp to preview.' : 'Enable a lamp to preview.') + ' Your brightness setting is saved for all lamps.';
    const slider = document.getElementById('brightness');
    // Keep a native drag or keyboard edit intact when the service pushes state.
    if (previewPointer === null && document.activeElement !== slider && !slider.matches(':active')) {
      slider.value = String(l.brightness_percent ?? 100);
    }
    document.getElementById('brightnessvalue').textContent = slider.value + '%';
  }
}

function relTime(iso) {
  const t = Date.parse(iso);
  if (isNaN(t)) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

function render() {
  document.getElementById('dashboardbtn').hidden = state.settings?.showDashboardButton !== true;
  const sessions = state.sessions;
  const counts = { needs_help: 0, active: 0, inactive: 0 };
  for (const s of sessions) if (s.status in counts) counts[s.status]++;

  document.getElementById('hicon').src = ICONS[state.aggregate] || ICONS.none;

  const live = sessions.length;
  let agg;
  if (live === 0) agg = 'No live sessions';
  else agg = live + ' live session' + (live === 1 ? '' : 's')
       + (counts.needs_help ? ' · ' + counts.needs_help + ' needs help' : '');
  document.getElementById('aggline').textContent = agg;

  const chipDefs = [
    ['dgreen', counts.active], ['dyellow', counts.inactive], ['dred', counts.needs_help],
  ];
  document.getElementById('chips').innerHTML = chipDefs
    .filter(([, n]) => n > 0)
    .map(([dot, n]) => `<span class="chip"><span class="dot ${dot}"></span>${n}</span>`)
    .join('');

  const settingsBtn = document.getElementById('settingsbtn');
  settingsBtn.textContent = view === 'sessions' ? 'Settings' : 'Back';
  settingsBtn.dataset.local = view === 'sessions' ? 'settings' : 'sessions';

  const groupsEl = document.getElementById('groups');
  if (view === 'lamp') {
    // Reuse the controls: replacing this subtree during a drag loses native focus.
    if (groupsEl.dataset.view !== 'lamp') {
      groupsEl.innerHTML = `<div class="grplabel">Lamps</div>` +
        `<div class="lamptop"><span id="lampsummary" role="status"></span><span id="lamptransport"></span></div>` +
        `<div class="lamplist" id="lamplist"></div>` +
        `<p class="lamperror" id="lamperror" role="alert" hidden></p>` +
        `<div class="brightness" id="brightnesscontrol"><label for="brightness">Light brightness` +
        `<output id="brightnessvalue" for="brightness"></output></label>` +
        `<input id="brightness" type="range" min="0" max="100" step="1" value="100" aria-describedby="brightnesshint">` +
        `<p id="brightnesshint"></p></div>` +
        `<div class="lampactions"><button class="pbtn" id="lampcontrol"></button></div>` +
        `<details class="lamptechnical" id="lamptechnical"><summary>Troubleshooting</summary>` +
        `<div class="lampdetail" id="lampdetail"></div></details>`;
    }
  } else if (view === 'settings') {
    const dashboardFocused = document.activeElement?.id === 'showdashboard';
    const mode = (state.settings && state.settings.yellowMode) || 'any_inactive';
    // Off unless opted in; then reflect the chosen readout.
    const usage = (state.settings && state.settings.usageEnabled)
      ? ((state.settings && state.settings.billingMode) || 'plan')
      : 'off';
    groupsEl.innerHTML =
      `<div class="grplabel">Appearance</div>` +
      `<label class="optrow" for="showdashboard">` +
      `<input type="checkbox" id="showdashboard" aria-describedby="dashboardhint">` +
      `<span class="sinfo"><span class="sname">Show Dashboard button</span>` +
      `<span class="smeta setdesc" id="dashboardhint">Open the terminal session monitor from the app.</span></span></label>` +
      `<p class="lamperror" id="settingserror" role="alert" hidden></p>` +
      `<div class="grplabel">Yellow light when sessions are mixed</div>` +
      YELLOW_OPTIONS.map(o =>
        `<div class="optrow" data-yellow="${o.value}">` +
        `<span class="radio${o.value === mode ? ' rsel' : ''}"></span>` +
        `<div class="sinfo"><span class="sname">${o.title}</span>` +
        `<span class="smeta setdesc">${o.desc}</span></div></div>`
      ).join('') +
      `<div class="grplabel">Usage tracking</div>` +
      USAGE_OPTIONS.map(o =>
        `<div class="optrow" data-usage="${o.value}">` +
        `<span class="radio${o.value === usage ? ' rsel' : ''}"></span>` +
        `<div class="sinfo"><span class="sname">${o.title}</span>` +
        `<span class="smeta setdesc">${o.desc}</span></div></div>`
      ).join('');
    const dashboardToggle = document.getElementById('showdashboard');
    dashboardToggle.checked = state.settings?.showDashboardButton === true;
    if (dashboardFocused) dashboardToggle.focus();
    const error = document.getElementById('settingserror');
    error.textContent = configActionError;
    error.hidden = !configActionError;
  } else if (live === 0) {
    groupsEl.innerHTML =
      `<div class="emptybox"><img src="${ICONS.none}" alt="">` +
      `<span>No live sessions</span></div>`;
  } else {
    let html = '';
    for (const g of GROUPS) {
      const rows = sessions.filter(s => s.status === g.status);
      if (!rows.length) continue;
      rows.sort((a, b) => Date.parse(b.lastUpdated) - Date.parse(a.lastUpdated));
      html += `<div class="grplabel">${g.label}</div>`;
      for (const s of rows) {
        const help = s.status === 'needs_help';
        const meta = esc(s.project) + (help ? ' · waiting for input' : '');
        const tail = help
          ? `<button class="focusbtn" data-cmd="focus" data-id="${esc(s.id)}">Focus</button>`
          : `<span class="time">${relTime(s.lastUpdated)}</span>`;
        const badge = s.badge ? `<span class="badge">${esc(s.badge)}</span>` : '';
        html += `<div class="srow${help ? ' helprow' : ''}" data-cmd="focus"` +
          ` data-id="${esc(s.id)}" title="Go to this session's terminal">` +
          `<span class="dot ${g.dot}"></span>` +
          `<div class="sinfo"><span class="sname">${badge}${esc(s.name)}</span>` +
          `<span class="smeta">${meta}</span></div>${tail}</div>`;
      }
    }
    groupsEl.innerHTML = html;
  }
  groupsEl.dataset.view = view;

  renderUsage();
  renderLamp();

  // Post synchronously: offsetHeight forces layout, and requestAnimationFrame
  // never fires while the window is hidden (no display link), which would
  // deadlock the deferred first show.
  // dpr rides along because on Windows the host sizes the window in physical
  // pixels from it — the only scale guaranteed to match the rendered surface.
  post({ cmd: 'resize', height: Math.ceil(document.getElementById('card').offsetHeight),
         dpr: window.devicePixelRatio });
}

window.__setState = payload => { state = payload; render(); };

document.addEventListener('toggle', ev => {
  if (ev.target.matches('details')) {
    post({ cmd: 'resize', height: Math.ceil(document.getElementById('card').offsetHeight),
           dpr: window.devicePixelRatio });
  }
}, true);

document.addEventListener('input', ev => {
  if (ev.target.id === 'brightness') {
    const percent = brightnessPercent(ev.target.value);
    if (percent === null) return;
    document.getElementById('brightnessvalue').textContent = percent + '%';
    previewBrightness(percent);
  }
});
document.addEventListener('pointerdown', ev => {
  if (ev.target.id !== 'brightness' || (ev.button !== undefined && ev.button !== 0)) return;
  stopBrightnessPreview();
  previewPointer = ev.pointerId;
  previewBrightness(ev.target.value, true);
  previewKeepAlive = setInterval(() => previewBrightness(document.getElementById('brightness').value, true), 500);
});
for (const event of ['pointerup', 'pointercancel']) {
  document.addEventListener(event, ev => {
    if (previewPointer !== null && ev.pointerId === previewPointer) stopBrightnessPreview();
  });
}
window.addEventListener('blur', stopBrightnessPreview);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopBrightnessPreview(); });
document.addEventListener('change', ev => {
  if (ev.target.id === 'showdashboard') {
    configActionError = '';
    document.getElementById('settingserror').hidden = true;
    post({ cmd: 'set_dashboard_button', enabled: ev.target.checked });
    return;
  }
  if (ev.target.id !== 'brightness') return;
  const percent = brightnessPercent(ev.target.value);
  if (percent === null) return;
  previewBrightness(percent, true);
  state.lamp = state.lamp || {};
  state.lamp.brightness_percent = percent;
  post({ cmd: 'set_brightness', percent });
});
document.addEventListener('focusout', ev => {
  if (ev.target.id === 'brightness' && view === 'lamp') {
    if (previewPointer === null) stopBrightnessPreview();
    renderLamp();
  }
});

document.addEventListener('click', ev => {
  const local = ev.target.closest('[data-local]');
  if (local) {
    if (view === 'lamp') stopBrightnessPreview();
    view = view === local.dataset.local ? 'sessions' : local.dataset.local;
    render();
    return;
  }
  const opt = ev.target.closest('[data-yellow]');
  if (opt) {
    // Update optimistically; the host confirms with a fresh __setState after
    // writing the config.
    state.settings = state.settings || {};
    state.settings.yellowMode = opt.dataset.yellow;
    post({ cmd: 'set_yellow_mode', mode: opt.dataset.yellow });
    render();
    return;
  }
  const usa = ev.target.closest('[data-usage]');
  if (usa) {
    const v = usa.dataset.usage;
    const enabled = v !== 'off';
    // Keep the last Plan/API choice when toggling Off, so turning it back on
    // restores the previous readout.
    const mode = enabled ? v : ((state.settings && state.settings.billingMode) || 'plan');
    state.settings = state.settings || {};
    state.settings.usageEnabled = enabled;
    state.settings.billingMode = mode;
    post({ cmd: 'set_usage', enabled, mode });
    render();
    return;
  }
  const btn = ev.target.closest('[data-cmd]');
  if (!btn) return;
  if (view === 'lamp') stopBrightnessPreview();
  const msg = { cmd: btn.dataset.cmd };
  if (btn.dataset.id !== undefined) msg.id = btn.dataset.id;
  if (btn.dataset.enabled !== undefined) msg.enabled = btn.dataset.enabled === 'true';
  if (msg.cmd === 'forget_lamp') {
    if (pendingForgetId !== null || !msg.id) return;
    pendingForgetId = msg.id;
    configActionError = '';
    renderLamp();
  }
  // Optimistic enable is pending, never a successful connection.
  if (msg.cmd === 'set_led') {
    state.lamp = state.lamp || {};
    state.lamp.enabled = msg.enabled;
    state.lamp.state = msg.enabled ? 'connecting' : 'disabled';
    state.lamp.devices = [];
    state.lamp.detail = msg.enabled ? 'Waiting for the service.' : 'Stopping lamp updates.';
    renderLamp();
  }
  post(msg);
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  stopBrightnessPreview();
  if (view !== 'sessions') { view = 'sessions'; render(); }
  else post({ cmd: 'hide' });
});
document.addEventListener('contextmenu', ev => ev.preventDefault());
setInterval(() => { if (state.sessions.length) render(); }, 30000);
render();
post({ cmd: 'ready' });
</script>
</body>
</html>
