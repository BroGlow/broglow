<!DOCTYPE html>
<html>
<head>

</head>
<body class="__PLATFORM__">
<div class="pop" id="card">
  <div class="pophead">
    <img id="hicon" src="__ICON_NONE__" alt="">
    <div class="sinfo">
      <span class="apptitle">BroGlow</span>
      <span class="agg" id="aggline">No live sessions</span>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="grp" id="groups"></div>
  <p class="lamperror" id="sessionerror" role="alert" hidden></p>
  <div class="usec" id="usage" hidden></div>
  <div class="popfoot">
    <button class="pbtn pbtnpri" id="dashboardbtn" data-cmd="dashboard" hidden>Dashboard</button>
    <button class="pbtn" id="settingsbtn" data-local="settings">Settings</button>
    <span class="f1"></span>
    <button class="pbtn pbtnghost lampbtn" id="lampbtn" data-local="lamp"></button>
    <button class="pbtn pbtnghost" data-cmd="quit">Quit</button>
  </div>
</div>
<script>__POPOVER_PRESENTATION__</script>
__POPOVER_HOST__
<script>__POPOVER_SCRIPT__</script>

</html>
